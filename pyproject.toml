[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mf-rag"
version = "0.1.0"
description = "Facts-only RAG FAQ assistant for 5 HDFC AMC mutual fund schemes"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "trafilatura>=1.8",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "streamlit>=1.35",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "model: needs the sentence-transformers model to be downloadable (skip with -m 'not model')",
]
